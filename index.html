<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  background: #fafafa; color: #222;
  transition: background 0.4s;
}
body.prep { background: #fff3cd; }
body.work { background: #fafafa; }
body.rest { background: #d4edda; }

.container {
  text-align: center;
  width: 90%;
  max-width: 400px;
  padding: 2rem;
}

#phase {
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #999;
  margin-bottom: 0.5rem;
}

#timer {
  font-size: clamp(3.5rem, 15vw, 6rem);
  font-weight: 200;
  letter-spacing: 0.05em;
  margin: 1rem 0;
  color: #222;
}

#set-info {
  font-size: 0.8rem;
  color: #bbb;
  margin-bottom: 2rem;
}

.progress {
  display: flex; gap: 6px; justify-content: center;
  margin-bottom: 2rem;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #e0e0e0;
  transition: background 0.3s;
}
.dot.done { background: #222; }
.dot.active { background: #999; }

.settings {
  display: flex; flex-direction: column; gap: 0.75rem;
  align-items: center;
  margin-bottom: 2rem;
}
.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  width: 100%; max-width: 220px;
}
.setting-row span { font-size: 0.8rem; color: #999; }
.setting-row input {
  width: 60px; padding: 6px;
  text-align: center;
  border: 1px solid #ddd; border-radius: 4px;
  background: #fff; color: #222;
  font-size: 0.85rem;
  outline: none;
}
.setting-row input:focus { border-color: #999; }

.buttons { display: flex; gap: 0.75rem; justify-content: center; }
button {
  padding: 0.6rem 2rem;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid #222;
  border-radius: 2px;
  cursor: pointer;
  background: #222; color: #fff;
  transition: all 0.2s;
}
button:hover { background: #444; border-color: #444; }
button:disabled { opacity: 0.3; cursor: default; }
#reset-btn { background: transparent; color: #222; }
#reset-btn:hover { background: #f0f0f0; }
</style>
</head>
<body>
<div class="container">
<div id="phase">준비</div>
<div id="timer">00:05</div>
<div class="progress" id="progress"></div>
<div id="set-info">0 / 10</div>
<div class="settings" id="settings">
  <div class="setting-row"><span>준비 (초)</span><input type="number" id="prep-sec" value="5" min="1"></div>
  <div class="setting-row"><span>공부 (초)</span><input type="number" id="work-sec" value="15" min="1"></div>
  <div class="setting-row"><span>휴식 (초)</span><input type="number" id="rest-sec" value="5" min="1"></div>
  <div class="setting-row"><span>세트</span><input type="number" id="sets" value="10" min="1"></div>
</div>
<div class="buttons">
  <button id="start-btn" onclick="startTimer()">시작</button>
  <button id="reset-btn" onclick="resetTimer()">초기화</button>
</div>
</div>
<script>
let interval = null, remaining = 0, phase = 'prep', currentSet = 0, totalSets = 10, prepSec = 5, workSec = 15, restSec = 5;

function fmt(s) { return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }

function renderDots() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  for (let i = 0; i < totalSets; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < currentSet ? ' done' : (i === currentSet && interval ? ' active' : ''));
    p.appendChild(d);
  }
}

function phaseLabel() {
  if (phase === 'prep') return `준비 — ${currentSet+1}세트`;
  if (phase === 'work') return `공부 — ${currentSet+1}세트`;
  return `휴식 — ${currentSet+1}세트`;
}

function updateDisplay() {
  document.getElementById('timer').textContent = fmt(remaining);
  document.getElementById('phase').textContent = phaseLabel();
  document.getElementById('set-info').textContent = `${currentSet} / ${totalSets}`;
  document.body.className = phase;
  renderDots();
}

function tick() {
  remaining--;
  if (remaining < 0) {
    if (phase === 'prep') { phase = 'work'; remaining = workSec; }
    else if (phase === 'work') { phase = 'rest'; remaining = restSec; currentSet++; }
    else {
      if (currentSet >= totalSets) {
        clearInterval(interval); interval = null;
        document.getElementById('phase').textContent = '완료';
        document.getElementById('set-info').textContent = `${totalSets} / ${totalSets}`;
        document.getElementById('start-btn').disabled = false;
        renderDots();
        return;
      }
      phase = 'prep'; remaining = prepSec;
    }
  }
  updateDisplay();
}

function startTimer() {
  if (interval) return;
  prepSec = parseInt(document.getElementById('prep-sec').value) || 5;
  workSec = parseInt(document.getElementById('work-sec').value) || 50;
  restSec = parseInt(document.getElementById('rest-sec').value) || 10;
  totalSets = parseInt(document.getElementById('sets').value) || 10;
  if (remaining === 0) { remaining = prepSec; phase = 'prep'; currentSet = 0; }
  document.getElementById('start-btn').disabled = true;
  document.getElementById('settings').style.display = 'none';
  updateDisplay();
  interval = setInterval(tick, 1000);
}

function resetTimer() {
  clearInterval(interval); interval = null;
  remaining = 0; phase = 'prep'; currentSet = 0;
  prepSec = parseInt(document.getElementById('prep-sec').value) || 5;
  workSec = parseInt(document.getElementById('work-sec').value) || 50;
  restSec = parseInt(document.getElementById('rest-sec').value) || 10;
  totalSets = parseInt(document.getElementById('sets').value) || 10;
  document.getElementById('start-btn').disabled = false;
  document.getElementById('settings').style.display = 'flex';
  document.getElementById('phase').textContent = '준비';
  document.getElementById('timer').textContent = fmt(prepSec);
  document.getElementById('set-info').textContent = `0 / ${totalSets}`;
  renderDots();
}

renderDots();
</script>
</body>
</html>
