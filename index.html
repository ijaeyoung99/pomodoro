<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f0f0f;
  --card: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.08);
  --text: #f0f0f0;
  --text-dim: rgba(255,255,255,0.4);
  --accent: #a78bfa;
  --accent-glow: rgba(167,139,250,0.25);
  --prep: #f59e0b;
  --prep-glow: rgba(245,158,11,0.2);
  --work: #a78bfa;
  --work-glow: rgba(167,139,250,0.2);
  --rest: #34d399;
  --rest-glow: rgba(52,211,153,0.2);
}

body {
  font-family: 'Inter', -apple-system, sans-serif;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  background: var(--bg); color: var(--text);
  transition: background 0.6s;
}

body.prep { background: #0f0d08; }
body.work { background: #0d0b14; }
body.rest { background: #08100d; }

.container {
  text-align: center;
  width: 90%;
  max-width: 420px;
  padding: 2.5rem 2rem;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  backdrop-filter: blur(20px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

#phase {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-glow);
  padding: 0.35rem 1rem;
  border-radius: 100px;
  margin-bottom: 1.5rem;
  transition: color 0.4s, background 0.4s;
}

body.prep #phase { color: var(--prep); background: var(--prep-glow); }
body.work #phase { color: var(--work); background: var(--work-glow); }
body.rest #phase { color: var(--rest); background: var(--rest-glow); }

#timer {
  font-size: clamp(3.5rem, 15vw, 5.5rem);
  font-weight: 200;
  letter-spacing: 0.08em;
  margin: 0.5rem 0;
  color: var(--text);
  transition: text-shadow 0.4s;
}

body.prep #timer { text-shadow: 0 0 40px var(--prep-glow); }
body.work #timer { text-shadow: 0 0 40px var(--work-glow); }
body.rest #timer { text-shadow: 0 0 40px var(--rest-glow); }

#set-info {
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--text-dim);
  margin-bottom: 1.5rem;
}

.progress {
  display: flex; gap: 6px; justify-content: center;
  margin-bottom: 2rem;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  transition: all 0.3s;
}
.dot.done { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
.dot.active { background: rgba(255,255,255,0.35); animation: pulse-dot 1.5s ease-in-out infinite; }

@keyframes pulse-dot {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.4); opacity: 1; }
}

.settings {
  display: flex; flex-direction: column; gap: 0.65rem;
  align-items: center;
  margin-bottom: 2rem;
}
.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  width: 100%; max-width: 220px;
}
.setting-row span {
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--text-dim);
}
.setting-row input {
  width: 60px; padding: 8px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.setting-row input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.buttons { display: flex; gap: 0.75rem; justify-content: center; }
button {
  padding: 0.7rem 2.2rem;
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: var(--accent);
  color: #0f0f0f;
  transition: all 0.25s;
  box-shadow: 0 2px 12px var(--accent-glow);
}
button:hover { transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
button:active { transform: translateY(0); }
button:disabled { opacity: 0.3; cursor: default; transform: none; box-shadow: none; }
#reset-btn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: none;
}
#reset-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); transform: translateY(-1px); }
canvas#particles {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
}

.ring-wrapper {
  position: relative;
  display: inline-block;
  margin: 0.5rem 0 0.2rem;
}

.ring-svg {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 240px; height: 240px;
}

.ring-bg {
  fill: none;
  stroke: rgba(255,255,255,0.06);
  stroke-width: 3;
}

.ring-fill {
  fill: none;
  stroke: var(--accent);
  stroke-width: 3;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.4s linear, stroke 0.4s;
  filter: drop-shadow(0 0 6px var(--accent-glow));
}

body.prep .ring-fill { stroke: var(--prep); filter: drop-shadow(0 0 6px var(--prep-glow)); }
body.work .ring-fill { stroke: var(--work); filter: drop-shadow(0 0 6px var(--work-glow)); }
body.rest .ring-fill { stroke: var(--rest); filter: drop-shadow(0 0 6px var(--rest-glow)); }

#quote {
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--text-dim);
  margin-top: 1.5rem;
  min-height: 1.2em;
  transition: opacity 0.5s;
  font-style: italic;
}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="container">
<div id="phase">준비</div>
<div class="ring-wrapper">
  <svg class="ring-svg" viewBox="0 0 240 240">
    <circle class="ring-bg" cx="120" cy="120" r="110"/>
    <circle class="ring-fill" id="ring" cx="120" cy="120" r="110"
      stroke-dasharray="691.15" stroke-dashoffset="0"
      transform="rotate(-90 120 120)"/>
  </svg>
  <div id="timer">00:05</div>
</div>
<div class="progress" id="progress"></div>
<div id="set-info">1 / 10</div>
<div class="settings" id="settings">
  <div class="setting-row"><span>준비 (초)</span><input type="number" id="prep-sec" value="5" min="1"></div>
  <div class="setting-row"><span>공부 (초)</span><input type="number" id="work-sec" value="15" min="1"></div>
  <div class="setting-row"><span>휴식 (초)</span><input type="number" id="rest-sec" value="5" min="1"></div>
  <div class="setting-row"><span>세트</span><input type="number" id="sets" value="10" min="1"></div>
</div>
<div class="buttons">
  <button id="start-btn" onclick="startTimer()">시작</button>
  <button id="reset-btn" onclick="resetTimer()">초기화</button>
<div id="quote"></div>
</div>
</div>
<script>
// --- Particles ---
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
const PARTICLE_COUNT = 50;
const phaseColors = {
  '': [167,139,250], prep: [245,158,11], work: [167,139,250], rest: [52,211,153]
};

function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resizeCanvas);
resizeCanvas();

for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 0.5,
    dx: (Math.random() - 0.5) * 0.3,
    dy: (Math.random() - 0.5) * 0.3,
    o: Math.random() * 0.3 + 0.05
  });
}

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const c = phaseColors[document.body.className] || phaseColors[''];
  particles.forEach(p => {
    p.x += p.dx; p.y += p.dy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${p.o})`;
    ctx.fill();
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// --- Quotes ---
const quotes = {
  prep: ['집중할 준비를 하세요', '심호흡, 마음을 가다듬고', '이번 세트도 해낼 수 있어요', '자세를 바르게, 시선을 모아'],
  work: ['지금 이 순간에 집중하세요', '꾸준함이 천재를 이긴다', '포기하지 마세요, 거의 다 왔어요', '몰입은 최고의 능력이다'],
  rest: ['잘했어요, 잠시 쉬어가세요', '눈을 감고 깊게 숨을 쉬세요', '충분한 휴식도 실력이에요', '스트레칭을 해보는 건 어때요?']
};
let lastQuotePhase = '';

function updateQuote(p) {
  if (p === lastQuotePhase) return;
  lastQuotePhase = p;
  const el = document.getElementById('quote');
  el.style.opacity = '0';
  setTimeout(() => {
    const list = quotes[p] || quotes.prep;
    el.textContent = list[Math.floor(Math.random() * list.length)];
    el.style.opacity = '1';
  }, 300);
}

// --- Ring ---
const CIRCUMFERENCE = 2 * Math.PI * 110;
let phaseDuration = 0;

function updateRing() {
  if (!phaseDuration) return;
  const progress = remaining / phaseDuration;
  document.getElementById('ring').setAttribute('stroke-dashoffset', CIRCUMFERENCE * (1 - progress));
}

// --- Timer ---
let interval = null, remaining = 0, phase = 'prep', currentSet = 0, totalSets = 10, prepSec = 5, workSec = 15, restSec = 5;

function fmt(s) { return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }

function renderDots() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  for (let i = 0; i < totalSets; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < currentSet ? ' done' : (i === currentSet && interval ? ' active' : ''));
    p.appendChild(d);
  }
}

function phaseLabel() {
  if (phase === 'prep') return `준비 — ${currentSet+1}세트`;
  if (phase === 'work') return `공부 — ${currentSet+1}세트`;
  return `휴식 — ${currentSet+1}세트`;
}

function updateDisplay() {
  document.getElementById('timer').textContent = fmt(remaining);
  document.getElementById('phase').textContent = phaseLabel();
  document.getElementById('set-info').textContent = `${currentSet + 1} / ${totalSets}`;
  document.body.className = phase;
  updateRing();
  updateQuote(phase);
  renderDots();
}

function tick() {
  remaining--;
  if (remaining < 0) {
    if (phase === 'prep') { phase = 'work'; remaining = workSec; phaseDuration = workSec; }
    else if (phase === 'work') { phase = 'rest'; remaining = restSec; phaseDuration = restSec; }
    else {
      currentSet++;
      if (currentSet >= totalSets) {
        clearInterval(interval); interval = null;
        document.getElementById('phase').textContent = '완료';
        document.getElementById('set-info').textContent = `${totalSets} / ${totalSets}`;
        document.getElementById('start-btn').disabled = false;
        renderDots();
        return;
      }
      phase = 'prep'; remaining = prepSec; phaseDuration = prepSec;
    }
  }
  updateDisplay();
}

function startTimer() {
  if (interval) return;
  prepSec = parseInt(document.getElementById('prep-sec').value) || 5;
  workSec = parseInt(document.getElementById('work-sec').value) || 50;
  restSec = parseInt(document.getElementById('rest-sec').value) || 10;
  totalSets = parseInt(document.getElementById('sets').value) || 10;
  if (remaining === 0) { remaining = prepSec; phaseDuration = prepSec; phase = 'prep'; currentSet = 0; }
  document.getElementById('start-btn').disabled = true;
  document.getElementById('settings').style.display = 'none';
  updateDisplay();
  interval = setInterval(tick, 1000);
}

function resetTimer() {
  clearInterval(interval); interval = null;
  remaining = 0; phase = 'prep'; currentSet = 0;
  prepSec = parseInt(document.getElementById('prep-sec').value) || 5;
  workSec = parseInt(document.getElementById('work-sec').value) || 50;
  restSec = parseInt(document.getElementById('rest-sec').value) || 10;
  totalSets = parseInt(document.getElementById('sets').value) || 10;
  document.getElementById('start-btn').disabled = false;
  document.getElementById('settings').style.display = 'flex';
  document.body.className = '';
  document.getElementById('phase').textContent = '준비';
  document.getElementById('timer').textContent = fmt(prepSec);
  document.getElementById('set-info').textContent = `0 / ${totalSets}`;
  document.getElementById('ring').setAttribute('stroke-dashoffset', '0');
  phaseDuration = 0;
  lastQuotePhase = '';
  document.getElementById('quote').textContent = '';
  renderDots();
}

renderDots();
</script>
</body>
</html>
